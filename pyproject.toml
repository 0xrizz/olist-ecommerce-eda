[project]
name = "olist-ecommerce-eda"
version = "1.0.0"
description = "Exploratory Data Analysis: Profitability, Supply Chain Logistics & Freight Ratio Optimization on Olist Brazilian E-Commerce"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pramono Tirta Luhung" },
    { name = "Achmad Azhar Abdullah" },
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
